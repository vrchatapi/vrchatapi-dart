on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vrchatapi/vrchatapi-dart
          ref: ${{ inputs.ref || github.ref }}

      - uses: dart-lang/setup-dart@v1.8.0

      - id: pub
        uses: actions/cache/restore@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: vrchatapi/specification/.github/actions/generator@ci/modernise-actions

      - uses: vrchatapi/specification/.github/actions/bundle@ci/modernise-actions
        with:
          bundle: openapi-legacy.yaml

      - run: |
          mkdir -p ../vrchatapi-specification/dist
          mv openapi-legacy.yaml ../vrchatapi-specification/dist/

      - id: generate
        run: ./generate.sh local

      # Saved even when generation fails, so a broken build does not also pay a
      # cold pub install every run.
      - if: always() && steps.pub.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}

      - run: dart analyze
        working-directory: vrchat_dart_generated
