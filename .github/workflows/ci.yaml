on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main
    outputs:
      artifact:
        description: Download URL for the generated SDK.
        value: ${{ jobs.generate.outputs.artifact }}

name: CI

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vrchatapi/vrchatapi-dart
          ref: ${{ inputs.ref || github.ref }}

      - uses: dart-lang/setup-dart@v1.8.0

      - uses: vrchatapi/specification/.github/actions/setup-generator@ci/modernise-actions

      - uses: vrchatapi/specification/.github/actions/download@ci/modernise-actions
        with:
          bundle: openapi-legacy.yaml

      - run: |
          mkdir -p ../vrchatapi-specification/dist
          mv openapi-legacy.yaml ../vrchatapi-specification/dist/

      - run: ./generate.sh local

      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: generated-dart
          path: .
          include-hidden-files: true

  analyze:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-dart

      - uses: dart-lang/setup-dart@v1.8.0

      - run: dart pub get
        working-directory: vrchat_dart_generated

      - run: dart analyze
        working-directory: vrchat_dart_generated

  pana:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [vrchat_dart, vrchat_dart_generated]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-dart

      - uses: dart-lang/setup-dart@v1.8.0

      - run: dart pub get

      - run: dart pub publish --dry-run

      - run: |
          dart pub global activate pana
          pana --no-warning --exit-code-threshold 0
