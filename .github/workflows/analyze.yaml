name: Analyze

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      artifact:
        description: Artifact to analyze instead of checking out the repository.
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.repository == 'vrchatapi/vrchatapi-dart' && format('{0}-{1}', github.workflow, github.ref) || format('analyze-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [vrchat_dart, vrchat_dart_generated]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - if: ${{ inputs.artifact }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
      - if: ${{ !inputs.artifact }}
        uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
      - name: Pub cache
        uses: actions/cache@v6
        env:
          cache-name: ${{ matrix.package }}
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ env.cache-name }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ env.cache-name }}-
      - run: |
          dart pub get
          if [ -d example_flutter ]; then
            dart pub get --directory=example_flutter
          fi
      - run: dart analyze --fatal-infos
      - run: dart pub publish --dry-run
      - name: Pana
        run: |
          dart pub global activate pana
          if [ ! -f pubspec_overrides.yaml ]; then
            pana --no-warning --exit-code-threshold 0
            exit
          fi

          # pana removes pubspec_overrides.yaml and resolves the hosted
          # constraint. Until that generated version is published, it cannot
          # resolve, so check formatting instead. dart analyze already used the
          # sibling package.
          mv pubspec_overrides.yaml pubspec_overrides.yaml.bak
          if dart pub get --no-example; then
            resolved=1
          else
            resolved=0
          fi
          mv pubspec_overrides.yaml.bak pubspec_overrides.yaml
          dart pub get --no-example
          if [ "$resolved" = 1 ]; then
            pana --no-warning --exit-code-threshold 0
          else
            dart format --output=none --set-exit-if-changed .
          fi
