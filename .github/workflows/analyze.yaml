name: Analyze

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      artifact:
        description: Artifact to analyze instead of checking out the repository.
        required: false
        type: string
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [vrchat_dart, vrchat_dart_generated]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - if: ${{ inputs.artifact }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
      - if: ${{ !inputs.artifact }}
        uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
      - run: dart pub get
      - run: dart analyze

  pana:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [vrchat_dart, vrchat_dart_generated]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - if: ${{ inputs.artifact }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
      - if: ${{ !inputs.artifact }}
        uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: |
          dart pub global activate pana
          pana --no-warning --exit-code-threshold 0
