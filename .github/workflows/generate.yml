name: Generate

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      url:
        description: OpenAPI bundle URL. Release dispatches use the triggering release instead.
        required: false
        type: string
        default: https://github.com/vrchatapi/specification/releases/download/nightly/openapi-3.0.yaml

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          cache: true

      - name: Pub cache
        uses: actions/cache@v6
        env:
          cache-name: root
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ env.cache-name }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ env.cache-name }}-

      - uses: vrchatapi/specification/.github/actions/setup-generator@main
      - uses: vrchatapi/specification/.github/actions/download@main
        with:
          bundle: openapi-3.0.yaml
          url: ${{ github.event_name == 'workflow_dispatch' && inputs.url || '' }}
      - run: |
          mkdir -p ../vrchatapi-specification/dist
          mv openapi-3.0.yaml ../vrchatapi-specification/dist/
      - name: Generate
        run: ./generate.sh local

      - name: Check for CHANGELOG changes
        id: changelog
        run: |
          if git diff --quiet vrchat_dart_generated/CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changelog.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/regenerate-from-spec
          commit-message: "Regenerated from spec"
          title: "[CI] Regenerated from spec"
          body: "Regenerated from spec"
